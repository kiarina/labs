<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みぃねこ：全身モーションの連番確認</title><style>body{margin:20px;background:#20232a;color:#edf0f5;font:15px system-ui}h1{font-size:22px}a{color:#ddc4ee}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{padding:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}figure{margin:0;background:#30353d;border-radius:6px;overflow:hidden}img{width:100%;display:block}figcaption{padding:8px}video{max-width:100%;width:720px}p{line-height:1.6}</style>
<h1>みぃねこ：全身モーションの連番確認</h1><p>画像を押すと、同じ時刻の姿勢をビューアで開けます。腕上げ時の頭への入り込み、しゃがみ・キック時のリボンの折れを重点確認中です。</p><header><label>動作 <select id="motion"><option value="samba">Samba Dancing</option><option value="arms">腕上げ</option><option value="squat">しゃがみ</option><option value="kick">キック</option><option value="twist">ひねり</option><option value="jump">ジャンプ姿勢</option><option value="neutral">通常姿勢</option></select></label><label>向き <select id="angle"><option value="45">斜め</option><option value="0">正面</option><option value="90">側面</option><option value="180">背面</option></select></label><a href="body-study.html?motion=samba">再生ビューア</a></header><p><a href="artifacts/body-motion-review/samba-45.mp4">ダンス動画（15fps・18.2秒）</a></p><video controls poster="artifacts/body-motion-review/samba-0.000-45.png" preload="auto" src="artifacts/body-motion-review/samba-45.mp4"></video><div class="grid"></div><script type="module">const report=await(await fetch('results/body-motion-evaluation.json')).json();const motion=document.querySelector('#motion'),angle=document.querySelector('#angle');function draw(){const grid=document.querySelector('.grid');grid.replaceChildren();for(const row of report.samples.filter(r=>r.motion===motion.value)){const f=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),c=document.createElement('figcaption');a.href=`body-study.html?motion=${row.motion}&angle=${angle.value}&t=${row.time}`;img.src=`artifacts/body-motion-review/${row.motion}-${row.time.toFixed(3)}-${angle.value}.png`;img.alt=`${row.motion} ${row.time.toFixed(2)}秒`;c.textContent=img.alt;a.append(img);f.append(a,c);grid.append(f);}}motion.onchange=angle.onchange=draw;draw();</script></html>
