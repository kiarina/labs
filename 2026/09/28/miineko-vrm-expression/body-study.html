<style>*{box-sizing:border-box}body{margin:0;background:#20232a;color:#edf0f5;font:14px system-ui;height:100vh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:10px;padding:12px;align-items:center;flex-shrink:0}h1{font-size:17px;margin:0}label{display:flex;align-items:center;gap:5px}button,select{font:inherit;padding:6px;border:0;border-radius:4px}input[type=range]{width:180px}output{min-width:6ch}canvas{display:block;width:100%;flex:1;min-height:0}.note{width:100%;margin:0;color:#c5cad5;font-size:12px}a{color:#d6c5f3}@media(max-width:600px){h1{width:100%}header{gap:7px;font-size:12px}input[type=range]{width:130px}}</style>
<header><h1>みぃねこ：全身の変形チェック</h1><label>動作<select id="motion"><option value="neutral">通常姿勢</option><option value="arms">腕上げ・肘曲げ</option><option value="squat">深いしゃがみ</option><option value="kick">キック</option><option value="twist">胴体・首のひねり</option><option value="jump">ジャンプ姿勢</option><option value="samba">Samba Dancing</option></select></label><button id="play">再生</button><button id="reset">先頭へ</button><button id="prev">1コマ戻る</button><button id="next">1コマ進む</button><label>時刻<input id="time" type="range" min="0" max="3" step="0.033333333" value="0"><output id="timeOut">0.00秒</output></label><label>速度<select id="speed"><option value="1">1倍</option><option value="0.25">0.25倍</option></select></label><label>向き<select id="angle"><option value="0">正面</option><option value="45">斜め</option><option value="90">側面</option><option value="180">背面</option><option value="-45">反対斜め</option></select></label><label><input id="bones" type="checkbox">骨を表示</label><label>表情<select id="face"><option value="neutral">通常</option><option value="happy">にっこり＋口</option><option value="blink">閉じ目</option><option value="surprised">驚き＋口</option></select></label><button id="record">1周を録画</button><a id="download" hidden>録画を保存</a><span id="status">読込中</span><p class="note">身体の変形を調べる試験です。関節テストは動きを大きくした検査用の姿勢です。床との接触は補正していません。時刻を固定して向きを変えると同じ姿勢を比較できます。<a href="body-review.html">動画・連番一覧へ</a>　<a href="expression-study.html?variant=blink-aligned">表情の比較へ</a></p></header><canvas></canvas>
