<!doctype html><html lang="ja"><meta charset="utf-8">
<title>みぃねこ — 表情の比較</title>
<style>
body{margin:0;background:#20232a;color:#edf0f5;font:16px system-ui;height:100vh;display:flex;flex-direction:column}header{padding:16px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex-shrink:0}h1{font-size:19px;margin:0}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:5px 12px}button[aria-pressed=true]{background:#f5c3da}#status{color:#abb8c9;font-size:13px}canvas{display:block;width:100%;flex:1;min-height:0}[hidden]{display:none!important}.motion-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-basis:100%;font-size:14px;border-top:1px solid #454b57;padding-top:12px}.motion-controls input[type=range]{width:100px}#mouth-progress{width:150px}#mouth-play{min-width:170px}#mouth-time{min-width:58px}#mouth-blend{color:#f5c3da;min-width:200px;white-space:nowrap}
@media(max-width:600px){body.motion-preview header{gap:8px;padding:10px;font-size:13px}body.motion-preview h1{font-size:16px}body.motion-preview header input[type=range]{width:90px}body.motion-preview button,body.motion-preview select{padding:5px 8px}body.motion-preview .motion-controls{font-size:13px;gap:8px}body.motion-preview #mouth-play{min-width:145px}body.motion-preview #mouth-blend{min-width:170px}}
</style>
<header><h1>みぃねこ：表情の比較</h1>
<select id="method" aria-label="比較する試作"><optgroup label="選んだ方向での試作"><option value="mouth-aa-aligned">採用版：目と5母音</option><option value="mouth-full-refined">比較：4母音を調整</option><option value="mouth-onset-recessed">比較：あの開き始めまで</option><option value="mouth-profile-fitted">比較：前の横顔</option><option value="mouth-vowels-flatstart">正面の基準：下側を平らに</option><option value="mouth-vowels-stable">比較：前の口の開き方</option><option value="mouth-red-bound-light">比較：口の輪郭を軽く</option><option value="mouth-red-bound">赤い口：元の輪郭</option><option value="overlay-selected-plus">選んだ案＋リラックス</option></optgroup><optgroup label="前の比較・参考"><option value="mouth-red-vowels">参考：調整前の５種類</option><option value="mouth-aa-onset">前の口：シンプル</option><option value="mouth-aa-tongue">前の口：ピンクを少し</option><option value="continuous-fresh">元のまばたき（選択時）</option><option value="overlay-refined">不採用：目尻を丸く調整</option><option value="continuous-blink-morph">参考：まぶたの形を動かす</option><option value="stitched-wide">参考：目の周囲を作り直す</option></optgroup></select>
<label>目を閉じる <input id="weight" type="range" min="0" max="1" step="0.01" value="0"><output id="value">0%</output></label>
<select id="eye"><option value="blink">両目</option><option value="blinkLeft">左目</option><option value="blinkRight">右目</option></select>
<label id="relaxed-control" hidden>リラックス <input id="relaxed" type="range" min="0" max="1" step="0.01" value="0"><output id="relaxed-value">0%</output></label>
<label id="mouth-control" hidden>口を開く <input id="mouth" type="range" min="0" max="1" step="0.01" value="0"><output id="mouth-value">0%</output></label>
<label id="vowel-control" hidden>口の形 <select id="vowel"><option value="aa">あ</option><option value="ih">い</option><option value="ou">う</option><option value="ee">え</option><option value="oh">お</option></select></label>
<select id="angle"><option value="0">正面</option><option value="45">右から斜め</option><option value="90">右から側面</option><option value="-45">左から斜め</option><option value="-90">左から側面</option></select>
<button id="natural" aria-pressed="false">自然なまばたき</button><button id="play" aria-pressed="false">ゆっくり確認</button><label><input id="lids" type="checkbox" checked>試作を表示（オフで元モデル）</label>
<span id="status">読み込み中</span>
<div id="mouth-preview" class="motion-controls" hidden>
<label>口の動き <select id="mouth-sequence"><option value="vowels">母音を順に確認</option><option value="conversation">会話風（無音）</option></select></label>
<button id="mouth-play" aria-pressed="false">口の動きを再生</button><button id="mouth-stop">停止・口を閉じる</button>
<label>速さ <select id="mouth-speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="1.5">1.5倍</option></select></label>
<label>開きの強さ <input id="mouth-strength" type="range" min="0" max="1" step="0.05" value="0.8"><output id="mouth-strength-value">80%</output></label>
<label>位置 <input id="mouth-progress" type="range" min="0" max="5500" step="10" value="0"><output id="mouth-time">0.00秒</output></label>
<span id="mouth-blend" aria-live="off">閉口</span>
</div></header><canvas id="canvas"></canvas>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/","@pixiv/three-vrm":"/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {VOWELS, VOWEL_LABELS, normalizeVowels, MouthPlayback, clipDuration} from './scripts/mouth_motion.mjs';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin} from '@pixiv/three-vrm';
const params=new URLSearchParams(location.search);
const previewEnabled=params.get('motion')==='1';
document.body.classList.toggle('motion-preview',previewEnabled);
const canvas=document.querySelector('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#b7b7b7');
scene.add(new THREE.HemisphereLight(0xffffff,0x726778,2.5));
for(const [x,y,z,power] of [[-1.2,2.5,1.5,3],[1.5,1.6,.4,1.5]]){const light=new THREE.DirectionalLight(0xffffff,power);light.position.set(x,y,z);scene.add(light);}
const camera=new THREE.OrthographicCamera(-.41,.41,.41,-.41,.01,100);
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(w<1||h<1)return;renderer.setSize(w,h,false);const aspect=w/h;const half=.41*(previewEnabled?Math.max(1,1/aspect):1);camera.top=half;camera.bottom=-half;camera.left=-half*aspect;camera.right=half*aspect;camera.updateProjectionMatrix();renderer.render(scene,camera);}
window.addEventListener('resize',resize);resize();
new ResizeObserver(resize).observe(canvas);
const loader=new GLTFLoader();loader.register(p=>new VRMLoaderPlugin(p));
const file=params.get('model')||'mouth-aa-aligned';
const methodSelect=document.querySelector('#method');
if([...methodSelect.options].some(o=>o.value===file))methodSelect.value=file;
else{const option=new Option(file,file,true,true);methodSelect.add(option);}
methodSelect.onchange=e=>{const next=new URLSearchParams({model:e.target.value});if(previewEnabled)next.set('motion','1');location.search=next.toString();};
if(!/^[a-z0-9-]+$/.test(file))throw new Error('Invalid local artifact directory');
const gltf=await loader.loadAsync(`/artifacts/${file}/continuous-blink.vrm`);
const vrm=gltf.userData.vrm;scene.add(vrm.scene);
const reference=(await loader.loadAsync('/artifacts/base-vrm.vrm')).userData.vrm;
scene.add(reference.scene);reference.update(0);reference.scene.visible=false;
let motion=null,motionStart=0,weight=0,angle=0,eye='blink',lidsVisible=true,relaxation=0,mouthOpening=0,mouthVowel='aa';
const hasRelaxed=(vrm.expressionManager.getExpression('relaxed')?.binds.length||0)>0;
const hasMouth=(vrm.expressionManager.getExpression('aa')?.binds.length||0)>0;
document.querySelector('#relaxed-control').hidden=!hasRelaxed;
document.querySelector('#mouth-control').hidden=!hasMouth;
const vowels=VOWELS;
const mouthPlayback=new MouthPlayback();let mouthWeights=normalizeVowels();
const hasVowels=vowels.every(v=>(vrm.expressionManager.getExpression(v)?.binds.length||0)>0);
document.querySelector('#vowel-control').hidden=!hasVowels;
document.querySelector('#mouth-preview').hidden=!hasVowels||!previewEnabled;
const lids=[];vrm.scene.traverse(o=>{if(o.isMesh&&(o.name.startsWith('Lid')||o.name.startsWith('Eye_patch')))lids.push(o);});
function set({w=weight,a=angle,e=eye,visible=lidsVisible,r=relaxation,m,v,mix}={}){
 weight=w;angle=a;eye=e;lidsVisible=visible;relaxation=hasRelaxed?r:0;
 if(mix!==undefined&&hasVowels){
  mouthWeights=normalizeVowels(mix);
  const dominant=vowels.reduce((a,b)=>mouthWeights[a]>=mouthWeights[b]?a:b);
  if(mouthWeights[dominant]>0)mouthVowel=dominant;
 }else if(m!==undefined||v!==undefined){
  mouthVowel=hasVowels&&vowels.includes(v??mouthVowel)?(v??mouthVowel):'aa';
  mouthWeights=normalizeVowels({[mouthVowel]:hasMouth?(m??mouthOpening):0});
 }
 mouthOpening=vowels.reduce((s,name)=>s+mouthWeights[name],0);
 for(const name of ['blink','blinkLeft','blinkRight'])vrm.expressionManager.setValue(name,0);
 vrm.expressionManager.setValue('relaxed',relaxation);
 for(const name of vowels)vrm.expressionManager.setValue(name,mouthWeights[name]);
 vrm.expressionManager.setValue(eye,weight);vrm.update(0);
 vrm.scene.visible=visible;reference.scene.visible=!visible;
 const rad=angle*Math.PI/180;camera.position.set(2.5*Math.sin(rad),.64,2.5*Math.cos(rad));camera.lookAt(0,.64,0);
 renderer.render(scene,camera);
 document.querySelector('#weight').value=weight;document.querySelector('#value').value=`${Math.round(weight*100)}%`;document.querySelector('#lids').checked=lidsVisible;
 document.querySelector('#relaxed').value=relaxation;document.querySelector('#relaxed-value').value=`${Math.round(relaxation*100)}%`;
 document.querySelector('#mouth').value=mouthOpening;document.querySelector('#mouth-value').value=`${Math.round(mouthOpening*100)}%`;
 document.querySelector('#vowel').value=mouthVowel;
 document.querySelector('#mouth-blend').textContent=vowels.filter(v=>mouthWeights[v]>.01).map(v=>`${VOWEL_LABELS[v]} ${Math.round(mouthWeights[v]*100)}%`).join(' ＋ ')||'閉口';
}
function setMotion(mode){motion=mode;motionStart=performance.now();document.querySelector('#natural').setAttribute('aria-pressed',String(mode==='natural'));document.querySelector('#play').setAttribute('aria-pressed',String(mode==='slow'));}
function blinkAt(ms){const t=ms%3000;const ease=x=>x*x*(3-2*x);if(t<1000)return 0;if(t<1100)return ease((t-1000)/100);if(t<1140)return 1;if(t<1320)return 1-ease((t-1140)/180);return 0;}
function refreshPlayback(){
 document.querySelector('#mouth-play').textContent=mouthPlayback.playing?'口の動きを一時停止':'口の動きを再生';
 document.querySelector('#mouth-play').setAttribute('aria-pressed',String(mouthPlayback.playing));
 document.querySelector('#mouth-progress').max=clipDuration(mouthPlayback.mode);
 document.querySelector('#mouth-progress').value=mouthPlayback.position;
 document.querySelector('#mouth-time').textContent=`${(mouthPlayback.position/1000).toFixed(2)}秒`;
 document.querySelector('#mouth-strength-value').textContent=`${Math.round(mouthPlayback.amount*100)}%`;
}
function seekMouth(ms){set({mix:mouthPlayback.seek(ms,performance.now())});refreshPlayback();}
function stopMouth(){set({mix:mouthPlayback.reset(performance.now())});refreshPlayback();}
function manualMouth(){mouthPlayback.reset(performance.now());refreshPlayback();}
window.probe={mouthPlayback,seekMouth,stopMouth,set,vrm,reference,renderer,scene,camera,loader,lids,hasRelaxed,hasMouth,hasVowels,blinkAt,setMotion,stats(){return lids.map(o=>({name:o.name,vertexAlpha:o.geometry.attributes.color?.itemSize,alphaMode:o.material.transparent,offset:o.material.map?.offset.toArray(),morphs:o.morphTargetInfluences,visible:o.visible}));}};
document.querySelector('#weight').oninput=e=>{setMotion(null);set({w:+e.target.value});};
document.querySelector('#relaxed').oninput=e=>set({r:+e.target.value});
document.querySelector('#mouth').oninput=e=>{manualMouth();set({m:+e.target.value});};
document.querySelector('#vowel').onchange=e=>{manualMouth();set({v:e.target.value});};
document.querySelector('#angle').onchange=e=>set({a:+e.target.value});
document.querySelector('#eye').onchange=e=>set({e:e.target.value});
document.querySelector('#lids').onchange=e=>set({visible:e.target.checked});
document.querySelector('#play').onclick=()=>setMotion(motion==='slow'?null:'slow');
document.querySelector('#natural').onclick=()=>setMotion(motion==='natural'?null:'natural');
document.querySelector('#mouth-play').onclick=()=>{set({mix:mouthPlayback.play(!mouthPlayback.playing,performance.now())});refreshPlayback();};
document.querySelector('#mouth-stop').onclick=stopMouth;
document.querySelector('#mouth-sequence').onchange=e=>{set({mix:mouthPlayback.select(e.target.value,performance.now())});refreshPlayback();};
document.querySelector('#mouth-speed').onchange=e=>{set({mix:mouthPlayback.configure({speed:+e.target.value},performance.now())});refreshPlayback();};
document.querySelector('#mouth-strength').oninput=e=>{set({mix:mouthPlayback.configure({amount:+e.target.value},performance.now())});refreshPlayback();};
document.querySelector('#mouth-progress').oninput=e=>seekMouth(+e.target.value);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mouthPlayback.playing){set({mix:mouthPlayback.play(false,performance.now())});refreshPlayback();}});
renderer.setAnimationLoop(t=>{
 if(motion||mouthPlayback.playing){
  const next={};
  if(motion)next.w=motion==='natural'?blinkAt(t-motionStart):(1-Math.cos((t-motionStart)*.003))/2;
  if(mouthPlayback.playing){next.mix=mouthPlayback.advance(t);refreshPlayback();}
  set(next);
 }
});
set();document.querySelector('#status').textContent='試作・品質評価中';window.ready=true;
</script></html>
