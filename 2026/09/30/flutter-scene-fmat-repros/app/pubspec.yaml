name: fmat_repro
description: Minimal reproductions for flutter_scene .fmat issues.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene:
    git:
      url: https://github.com/bdero/flutter_scene
      path: packages/flutter_scene
      ref: f706046e
  vector_math: ^2.2.0

dependency_overrides:
  scene:
    git:
      url: https://github.com/bdero/flutter_scene
      path: packages/scene
      ref: f706046e

flutter:
  assets:
    - models/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  uses-material-design: true
