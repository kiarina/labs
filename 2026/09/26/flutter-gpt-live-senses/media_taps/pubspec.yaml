name: media_taps
description: "Lab plugin: taps video frames and audio PCM from flutter_webrtc tracks on every platform."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Pinned: the native taps reach into flutter_webrtc's internals.
  flutter_webrtc: 1.6.2+hotfix.3
  dart_webrtc: 1.8.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kiarina.labs.media_taps
        pluginClass: MediaTapsPlugin
      ios:
        pluginClass: MediaTapsPlugin
      macos:
        pluginClass: MediaTapsPlugin
      windows:
        pluginClass: MediaTapsPluginCApi
      web:
        pluginClass: MediaTapsWeb
        fileName: media_taps_web.dart
