<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="D-FINE object detection with ONNX Runtime Web from Flutter Web.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_web_onnx_dfine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flutter Web ONNX Runtime</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Load onnxruntime-web before Flutter starts.
    ?bundle=all|webgpu switches to ort.all.min.js / ort.webgpu.min.js, ?threads=N sets ort.env.wasm.numThreads.
  -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var bundles = { min: "ort.min.js", all: "ort.all.min.js", webgpu: "ort.webgpu.min.js" };
      var bundle = bundles[params.get("bundle") || "min"];
      var ortScript = document.createElement("script");
      ortScript.src = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/" + bundle;
      ortScript.onload = function () {
        if (params.get("threads")) {
          window.ort.env.wasm.numThreads = Number(params.get("threads"));
        }
        var flutterScript = document.createElement("script");
        flutterScript.src = "flutter_bootstrap.js";
        document.body.appendChild(flutterScript);
      };
      document.body.appendChild(ortScript);
    })();
  </script>
</body>
</html>
