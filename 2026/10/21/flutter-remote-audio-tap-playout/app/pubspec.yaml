dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc:
    git:
      url: https://github.com/kiarina/flutter-webrtc.git
      ref: fce27274d2b07b78f9a4dea2c8ae5ba5482ca45b
  flutter_webrtc_external_media:
