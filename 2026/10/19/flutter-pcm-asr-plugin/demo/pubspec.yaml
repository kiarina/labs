publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  pcm_asr:
    path: ../pcm_asr
  record: 7.1.2
  flutter_onnxruntime: 1.9.0
  web: ^1.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/conversation.wav
