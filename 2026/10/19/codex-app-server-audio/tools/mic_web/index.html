<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ChatGPT 実マイク・聞き取り専用試験</title><style>body{font:18px system-ui;max-width:920px;margin:35px auto;padding:20px;background:#f5f6fa;color:#202434}button{font-size:19px;padding:14px 22px;margin:8px;border:0;border-radius:10px;background:#2549c9;color:white}button:disabled{opacity:.4}#stop{background:#a12636}#clock{font-size:48px;font-weight:bold}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:12px}#transcript{height:180px;overflow:auto}meter{width:300px}small{color:#535c72}</style><h1>実マイク・聞き取り専用試験</h1><p>ChatGPT ログインのみ。録音・会話文はファイルに保存しません。音声は OpenAI へ送ります。受信音声は計測だけに使い、スピーカーでは再生しません。</p><p>①マイクを準備し、入力音量を確認 → ②開始。接続できたら5分間のカウントが始まります。自然に話し、ときどき数秒の間を入れてください。</p><button id="prepare">① マイクを準備</button><button id="start" disabled>② 5分間の試験を開始</button><button id="stop" disabled>停止</button><p id="status">準備待ち</p><div id="clock">5:00</div><p>マイク入力 <meter id="input" min="0" max="0.2" value="0"></meter></p><pre id="metrics">まだ送信していません。</pre><h2>文字起こし（画面内だけ・終了時に消去）</h2><pre id="transcript"></pre><small>音声が生成されても再生はしません。発声の有無は、受信 PCM と assistant の文字起こしを別に測ります。</small><script src="/mic.js"></script></html>
