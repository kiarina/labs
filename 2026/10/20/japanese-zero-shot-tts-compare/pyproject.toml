[project]
name = "japanese-zero-shot-tts-compare"
version = "0.1.0"
description = "Compare CosyVoice 3 and Qwen3-TTS zero-shot voice cloning in Japanese"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The web server only. Each TTS engine has its own environment under engines/.
dependencies = [
    "fugashi==1.5.2",
    "mlx-whisper==0.4.3",
    "numpy==2.3.5",
    "soundfile==0.13.1",
    "unidic-lite==1.0.8",
]

[tool.uv]
package = false
