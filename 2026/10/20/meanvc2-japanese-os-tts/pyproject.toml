[project]
name = "meanvc2-japanese-os-tts"
version = "0.1.0"
description = "Try MeanVC2 zero-shot voice conversion on Japanese OS text-to-speech voices"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops==0.8.0",
    "gdown==5.2.2",
    "huggingface-hub==0.36.0",
    "librosa==0.11.0",
    "matplotlib==3.10.7",
    "numpy==2.0.2",
    "safetensors==0.6.2",
    "soundfile==0.13.1",
    "soxr==1.0.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "x-transformers==2.2.11",
]

[tool.uv]
package = false
