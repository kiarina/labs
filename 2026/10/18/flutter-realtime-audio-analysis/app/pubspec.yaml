name: hearing_lab
description: "Real-time microphone analysis lab app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  audio_analysis:
    path: ../packages/audio_analysis
  whisper_cpp:
    path: ../packages/whisper_cpp
  path_provider: 2.1.6
  record: 7.1.2
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/conversation_16k.wav
    - assets/fixtures/
    - assets/models/
