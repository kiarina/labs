// The Android Gradle Plugin builds the native code with the Android NDK.

group = "dev.kiarina.labs.whisper_cpp"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "dev.kiarina.labs.whisper_cpp"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        ndk {
            // whisper.cpp is only built for 64-bit ABIs (arm64 devices and
            // x86_64 emulators); 32-bit armeabi-v7a is not supported.
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                // -O3 is forced inside src/CMakeLists.txt for every variant.
                // Optional: -P whisper_cpp.armArch=armv8.2-a+dotprod+fp16 (or the
                // same key in the app's android/gradle.properties) builds the
                // arm64 library for newer cores only (faster, drops old devices).
                def armArch = project.findProperty("whisper_cpp.armArch") ?: ""
                arguments "-DANDROID_STL=c++_static", "-DWCPP_ANDROID_ARM_ARCH=${armArch}"
            }
        }
    }
}
